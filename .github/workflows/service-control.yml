name: Service Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the service operation
        required: true
        type: choice
        options:
          - start-all
          - stop-all
          - start-applications
          - stop-applications
          - start-monitoring
          - stop-monitoring
          - start-data-services
          - stop-data-services
      region:
        description: Must match Railway Settings > Deploy > Regions
        required: true
        default: eu-west
        type: choice
        options:
          - southeast-asia
          - us-west
          - us-east
          - eu-west
      confirm_stop:
        description: Required for every stop operation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-railway-operations
  cancel-in-progress: false

jobs:
  control-production:
    name: Control Production Services
    runs-on: ubuntu-latest
    environment:
      name: 'fearless-creation / production'

    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_PROJECT_NAME: ${{ vars.RAILWAY_PROJECT_NAME }}
      RAILWAY_ENVIRONMENT_NAME: production
      RAILWAY_REGION: ${{ inputs.region }}
      OPERATION: ${{ inputs.operation }}
      CONFIRM_STOP: ${{ inputs.confirm_stop }}

    steps:
      - name: Guard main branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "Production service controls are only allowed from the main branch."
          exit 1

      - name: Require confirmation for stop operations
        run: |
          if [[ "$OPERATION" == stop-* && "$CONFIRM_STOP" != "true" ]]; then
            echo "Stop operations require the confirmation checkbox."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.27.1

      - name: Verify Railway configuration
        run: |
          test -n "$RAILWAY_API_TOKEN" || (echo "Missing RAILWAY_API_TOKEN" && exit 1)
          test -n "$RAILWAY_PROJECT_ID" || (echo "Missing RAILWAY_PROJECT_ID" && exit 1)
          test -n "$RAILWAY_PROJECT_NAME" || (echo "Missing RAILWAY_PROJECT_NAME" && exit 1)
          test -n "$RAILWAY_REGION" || (echo "Missing Railway region" && exit 1)

          printf 'Railway project: %s (%s)\n' "$RAILWAY_PROJECT_NAME" "$RAILWAY_PROJECT_ID"
          printf 'Railway environment: %s\n' "$RAILWAY_ENVIRONMENT_NAME"
          printf 'Railway region: %s\n' "$RAILWAY_REGION"
          printf 'Operation: %s\n' "$OPERATION"

      - name: Link Railway project
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_NAME"

      - name: Control selected services
        shell: bash
        run: |
          set -euo pipefail

          data_start=("MySQL" "Postgres" "MongoDB" "Redis" "rabbitmq")
          data_stop=("rabbitmq" "Redis" "MongoDB" "Postgres" "MySQL")
          monitoring_start=("jaeger" "otel-collector" "prometheus" "grafana")
          monitoring_stop=("grafana" "prometheus" "otel-collector" "jaeger")
          applications_start=("auth-service" "user-service" "chat-service" "email-service" "gateway-service")
          applications_stop=("gateway-service" "email-service" "chat-service" "user-service" "auth-service")

          declare -A previous_deployment_ids
          declare -A railway_service_ids
          railway_environment_id=""

          railway_api() {
            local query="$1"
            local variables="$2"
            local response

            if ! response="$(
              jq -cn \
                --arg query "$query" \
                --argjson variables "$variables" \
                '{query: $query, variables: $variables}' |
                curl \
                  --silent \
                  --show-error \
                  --fail-with-body \
                  --request POST \
                  --url https://backboard.railway.com/graphql/v2 \
                  --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
                  --header 'Content-Type: application/json' \
                  --data-binary @-
            )"; then
              jq -r '.errors[]? | "Railway API error: \(.message)"' <<<"$response" >&2 || true
              return 1
            fi

            if jq -e '.errors? | length > 0' <<<"$response" >/dev/null; then
              jq -r '.errors[] | "Railway API error: \(.message)"' <<<"$response" >&2
              return 1
            fi

            printf '%s\n' "$response"
          }

          load_deployment_targets() {
            local query variables response service_name service_id

            query='query projectDeploymentTargets($projectId: String!) {
              project(id: $projectId) {
                environments { edges { node { id name } } }
                services { edges { node { id name } } }
              }
            }'
            variables="$(jq -cn --arg projectId "$RAILWAY_PROJECT_ID" '{projectId: $projectId}')"
            response="$(railway_api "$query" "$variables")" || return 1

            railway_environment_id="$(
              jq -r \
                --arg environment "$RAILWAY_ENVIRONMENT_NAME" \
                '.data.project.environments.edges[]
                 | select(.node.name == $environment)
                 | .node.id' <<<"$response" |
                head -n 1
            )"

            if [[ -z "$railway_environment_id" ]]; then
              echo "Could not resolve Railway environment ID for $RAILWAY_ENVIRONMENT_NAME."
              return 1
            fi

            while IFS=$'\t' read -r service_name service_id; do
              railway_service_ids["$service_name"]="$service_id"
            done < <(
              jq -r '.data.project.services.edges[] | [.node.name, .node.id] | @tsv' \
                <<<"$response"
            )
          }

          latest_deployment_summary() {
            local service="$1"

            railway deployment list \
              --service "$service" \
              --environment "$RAILWAY_ENVIRONMENT_NAME" \
              --limit 1 \
              --json 2>/dev/null |
              jq -r '
                (if type == "array" then .[0]
                 elif (.deployments? | type) == "array" then .deployments[0]
                 else . end) as $deployment
                | [($deployment.id // ""), ($deployment.status // "")]
                | @tsv
              '
          }

          print_service_logs() {
            local service="$1"

            printf '\n::group::Railway deployment logs for %s\n' "$service"
            railway logs \
              --service "$service" \
              --environment "$RAILWAY_ENVIRONMENT_NAME" \
              --latest \
              --deployment \
              --lines 200 || echo "Unable to retrieve Railway deployment logs for $service."
            echo "::endgroup::"
          }

          scale_services() {
            local replicas="$1"
            shift

            for service in "$@"; do
              printf '\nScaling %s to %s replica(s) in %s...\n' "$service" "$replicas" "$RAILWAY_REGION"
              railway scale \
                "$RAILWAY_REGION=$replicas" \
                --service "$service" \
                --environment "$RAILWAY_ENVIRONMENT_NAME"
            done
          }

          deploy_from_service_configuration() {
            local service="$1"
            local service_id="${railway_service_ids[$service]:-}"
            local query variables response deployment_id

            if [[ -z "$service_id" ]]; then
              echo "Could not resolve Railway service ID for $service."
              return 1
            fi

            query='mutation serviceInstanceDeployV2($serviceId: String!, $environmentId: String!) {
              serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId)
            }'
            variables="$(
              jq -cn \
                --arg serviceId "$service_id" \
                --arg environmentId "$railway_environment_id" \
                '{serviceId: $serviceId, environmentId: $environmentId}'
            )"
            response="$(railway_api "$query" "$variables")" || return 1
            deployment_id="$(jq -r '.data.serviceInstanceDeployV2 // empty' <<<"$response")"

            if [[ -z "$deployment_id" ]]; then
              echo "Railway did not return a deployment ID for $service."
              return 1
            fi

            printf 'Started fresh deployment %s for %s.\n' "$deployment_id" "$service"
          }

          redeploy_services() {
            local service previous_id previous_status

            for service in "$@"; do
              previous_id=""
              previous_status=""
              IFS=$'\t' read -r previous_id previous_status \
                < <(latest_deployment_summary "$service" || true) || true
              previous_deployment_ids["$service"]="$previous_id"

              if [[ -z "$previous_id" || "$previous_status" == "REMOVED" ]]; then
                printf '\n%s has no redeployable deployment; deploying from its Railway service configuration...\n' \
                  "$service"
                if ! deploy_from_service_configuration "$service"; then
                  echo "Failed to start a fresh deployment for $service."
                  print_service_logs "$service"
                  return 1
                fi
                continue
              fi

              printf '\nRedeploying %s from its most recent Railway deployment...\n' "$service"
              if railway redeploy \
                --service "$service" \
                --yes; then
                continue
              fi

              echo "Redeploy was unavailable for $service; deploying from its Railway service configuration..."
              if ! deploy_from_service_configuration "$service"; then
                echo "Failed to start a fresh deployment for $service."
                print_service_logs "$service"
                return 1
              fi
            done
          }

          wait_for_service() {
            local service="$1"
            local previous_id="${previous_deployment_ids[$service]:-}"
            local attempt deployment_id status

            printf 'Waiting for %s to become healthy...\n' "$service"

            for attempt in {1..60}; do
              deployment_id=""
              status=""
              IFS=$'\t' read -r deployment_id status \
                < <(latest_deployment_summary "$service" || true) || true

              printf '  attempt %s/60: deployment=%s status=%s\n' \
                "$attempt" "${deployment_id:-unknown}" "${status:-unknown}"

              if [[ -n "$deployment_id" && "$deployment_id" != "$previous_id" && "$status" == "SUCCESS" ]]; then
                printf '%s is healthy.\n' "$service"
                return 0
              fi

              if [[ -n "$deployment_id" && "$deployment_id" != "$previous_id" && \
                    ( "$status" == "FAILED" || "$status" == "CRASHED" || \
                      "$status" == "REMOVED" || "$status" == "SKIPPED" ) ]]; then
                printf '%s deployment ended with status %s.\n' "$service" "$status"
                print_service_logs "$service"
                return 1
              fi

              sleep 10
            done

            printf 'Timed out waiting for %s to become healthy.\n' "$service"
            print_service_logs "$service"
            return 1
          }

          wait_for_services() {
            for service in "$@"; do
              wait_for_service "$service"
            done
          }

          start_and_wait() {
            scale_services 1 "$@"
            redeploy_services "$@"
            wait_for_services "$@"
          }

          if [[ "$OPERATION" == start-* ]]; then
            load_deployment_targets
          fi

          case "$OPERATION" in
            start-all)
              start_and_wait "${data_start[@]}"
              echo "Data deployments succeeded; allowing databases and brokers to finish initialization..."
              sleep 20
              for service in "${monitoring_start[@]}"; do
                start_and_wait "$service"
              done
              start_and_wait "${applications_start[@]:0:4}"
              start_and_wait "${applications_start[4]}"
              ;;
            stop-all)
              scale_services 0 "${applications_stop[@]}"
              scale_services 0 "${monitoring_stop[@]}"
              scale_services 0 "${data_stop[@]}"
              ;;
            start-applications)
              start_and_wait "${applications_start[@]:0:4}"
              start_and_wait "${applications_start[4]}"
              ;;
            stop-applications)
              scale_services 0 "${applications_stop[@]}"
              ;;
            start-monitoring)
              for service in "${monitoring_start[@]}"; do
                start_and_wait "$service"
              done
              ;;
            stop-monitoring)
              scale_services 0 "${monitoring_stop[@]}"
              ;;
            start-data-services)
              start_and_wait "${data_start[@]}"
              ;;
            stop-data-services)
              scale_services 0 "${data_stop[@]}"
              ;;
            *)
              echo "Unsupported operation: $OPERATION"
              exit 1
              ;;
          esac

          echo "Completed operation: $OPERATION"
