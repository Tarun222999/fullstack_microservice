name: CD Observability

on:
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Deploy all observability services
        required: false
        default: false
        type: boolean
      deploy_jaeger:
        description: Deploy Jaeger
        required: false
        default: false
        type: boolean
      deploy_otel_collector:
        description: Deploy OpenTelemetry Collector
        required: false
        default: false
        type: boolean
      deploy_prometheus:
        description: Deploy Prometheus
        required: false
        default: false
        type: boolean
      deploy_grafana:
        description: Deploy Grafana
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: production-observability-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Production Observability
    runs-on: ubuntu-latest
    environment:
      name: 'fearless-creation / production'

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_PROJECT_NAME: ${{ vars.RAILWAY_PROJECT_NAME }}
      RAILWAY_ENVIRONMENT_NAME: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard main branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "Production deployments are only allowed from the main branch."
          exit 1

      - name: Require at least one deployment target
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          DEPLOY_JAEGER: ${{ inputs.deploy_jaeger }}
          DEPLOY_OTEL_COLLECTOR: ${{ inputs.deploy_otel_collector }}
          DEPLOY_PROMETHEUS: ${{ inputs.deploy_prometheus }}
          DEPLOY_GRAFANA: ${{ inputs.deploy_grafana }}
        run: |
          if [[ "$DEPLOY_ALL" != "true" && \
                "$DEPLOY_JAEGER" != "true" && \
                "$DEPLOY_OTEL_COLLECTOR" != "true" && \
                "$DEPLOY_PROMETHEUS" != "true" && \
                "$DEPLOY_GRAFANA" != "true" ]]; then
            echo "Select at least one observability service."
            exit 1
          fi

      - name: Verify CI succeeded for current main commit
        uses: actions/github-script@v7
        with:
          script: |
            const workflowFile = 'ci.yml';
            const branch = 'main';
            const currentSha = context.sha;

            const workflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
            });

            let page = 1;
            let matchingRun;

            while (!matchingRun) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.data.id,
                branch,
                event: 'push',
                per_page: 100,
                page,
              });

              matchingRun = runs.data.workflow_runs.find(
                (run) => run.head_sha === currentSha,
              );

              if (matchingRun || runs.data.workflow_runs.length < 100) {
                break;
              }

              page += 1;
            }

            if (!matchingRun) {
              core.setFailed(
                `No CI push run was found for commit ${currentSha} on ${branch}. Run CI on main before deploying.`,
              );
              return;
            }

            if (matchingRun.status !== 'completed') {
              core.setFailed(
                `CI for commit ${currentSha} is still ${matchingRun.status}. Wait for it to complete before deploying.`,
              );
              return;
            }

            if (matchingRun.conclusion !== 'success') {
              core.setFailed(
                `CI for commit ${currentSha} concluded with '${matchingRun.conclusion}'. Deployment is blocked.`,
              );
              return;
            }

            core.info(`Verified CI success for commit ${currentSha}.`);

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli@4.40.0

      - name: Verify Railway configuration
        run: |
          test -n "$RAILWAY_TOKEN" || (echo "Missing RAILWAY_TOKEN" && exit 1)
          test -n "$RAILWAY_PROJECT_ID" || (echo "Missing RAILWAY_PROJECT_ID" && exit 1)
          test -n "$RAILWAY_PROJECT_NAME" || (echo "Missing RAILWAY_PROJECT_NAME" && exit 1)

      - name: Deploy selected observability services
        shell: bash
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          DEPLOY_JAEGER: ${{ inputs.deploy_jaeger }}
          DEPLOY_OTEL_COLLECTOR: ${{ inputs.deploy_otel_collector }}
          DEPLOY_PROMETHEUS: ${{ inputs.deploy_prometheus }}
          DEPLOY_GRAFANA: ${{ inputs.deploy_grafana }}
        run: |
          set -euo pipefail

          services=()

          if [[ "$DEPLOY_ALL" == "true" || "$DEPLOY_JAEGER" == "true" ]]; then
            services+=("jaeger")
          fi

          if [[ "$DEPLOY_ALL" == "true" || "$DEPLOY_OTEL_COLLECTOR" == "true" ]]; then
            services+=("otel-collector")
          fi

          if [[ "$DEPLOY_ALL" == "true" || "$DEPLOY_PROMETHEUS" == "true" ]]; then
            services+=("prometheus")
          fi

          if [[ "$DEPLOY_ALL" == "true" || "$DEPLOY_GRAFANA" == "true" ]]; then
            services+=("grafana")
          fi

          printf 'Deploy target project: %s (%s)\n' "$RAILWAY_PROJECT_NAME" "$RAILWAY_PROJECT_ID"
          printf 'Railway environment: %s\n' "$RAILWAY_ENVIRONMENT_NAME"
          printf 'Services: %s\n' "${services[*]}"

          for service in "${services[@]}"; do
            printf '\nDeploying %s...\n' "$service"
            railway up \
              --service "$service" \
              --environment "$RAILWAY_ENVIRONMENT_NAME" \
              --project "$RAILWAY_PROJECT_ID" \
              --ci
          done
