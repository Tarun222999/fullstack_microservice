services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: chatapp-rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    container_name: chatapp-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: chatapp-mongo
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    volumes:
      - mongo-data:/data/db
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  user-db:
    image: postgres:16
    container_name: chatapp-user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-chatapp_user_service}
      POSTGRES_USER: ${USER_DB_USER:-chatapp_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-chatapp_password}
    ports:
      - '${USER_DB_PORT:-5432}:5432'
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - chatapp-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${USER_DB_USER:-chatapp_user} -d ${USER_DB_NAME:-chatapp_user_service}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: mysql:8.0
    container_name: chatapp-auth-db
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME:-chatapp_auth_service}
      MYSQL_USER: ${AUTH_DB_USER:-chatapp_auth_user}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-chatapp_auth_password}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-root_password}
    command: ['mysqld', '--default-authentication-plugin=mysql_native_password']
    ports:
      - '${AUTH_DB_PORT:-3306}:3306'
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - chatapp-network
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${AUTH_DB_ROOT_PASSWORD:-root_password}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: chatapp-gateway-service
    ports:
      - '${GATEWAY_PORT:-4000}:4000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-4000}
      USER_SERVICE_URL: http://user-service:4001
      AUTH_SERVICE_URL: http://auth-service:4003
      CHAT_SERVICE_URL: http://chat-service:4002
      EMAIL_SERVICE_URL: http://email-service:4004
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: gateway-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: chatapp-auth-service
    ports:
      - '${AUTH_SERVICE_PORT:-4003}:4003'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-4003}
      AUTH_DB_URL: ${AUTH_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-false}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
      OUTBOX_LOCK_TIMEOUT_MS: ${OUTBOX_LOCK_TIMEOUT_MS:-30000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4003/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: chatapp-user-service
    ports:
      - '${USER_SERVICE_PORT:-4001}:4001'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-4001}
      USER_DB_URL: ${USER_DB_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-false}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
      OUTBOX_LOCK_TIMEOUT_MS: ${OUTBOX_LOCK_TIMEOUT_MS:-30000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      CONSUMER_DEDUPE_ENABLED: ${CONSUMER_DEDUPE_ENABLED:-true}
      CONSUMER_LOCK_TIMEOUT_MS: ${CONSUMER_LOCK_TIMEOUT_MS:-30000}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: chatapp-chat-service
    ports:
      - '${CHAT_SERVICE_PORT:-4002}:4002'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CHAT_SERVICE_PORT: ${CHAT_SERVICE_PORT:-4002}
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      CONSUMER_DEDUPE_ENABLED: ${CONSUMER_DEDUPE_ENABLED:-true}
      CONSUMER_LOCK_TIMEOUT_MS: ${CONSUMER_LOCK_TIMEOUT_MS:-30000}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: chat-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4002/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  email-service:
    build:
      context: services/email-service
      dockerfile: Dockerfile
    container_name: chatapp-email-service
    ports:
      - '${EMAIL_SERVICE_PORT:-4004}:4004'
    environment:
      EMAIL_SERVICE_PORT: ${EMAIL_SERVICE_PORT:-4004}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_NAME: ${APP_NAME:-Pulse Chat}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#00e676}
      BRAND_BACKGROUND_COLOR: ${BRAND_BACKGROUND_COLOR:-#05080d}
      BRAND_SURFACE_COLOR: ${BRAND_SURFACE_COLOR:-#0a0f14}
      BRAND_TEXT_COLOR: ${BRAND_TEXT_COLOR:-#f8fafc}
      BRAND_MUTED_COLOR: ${BRAND_MUTED_COLOR:-#8b95a7}
      BRAND_BORDER_COLOR: ${BRAND_BORDER_COLOR:-#173526}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: email-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-5000}
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - chatapp-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4004/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    container_name: chatapp-otel-collector
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_COLLECTOR_PROMETHEUS_PORT:-9464}:9464'
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    networks:
      - chatapp-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: chatapp-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    networks:
      - chatapp-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    container_name: chatapp-jaeger
    ports:
      - '127.0.0.1:${JAEGER_UI_PORT:-16686}:16686'
    networks:
      - chatapp-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.2
    container_name: chatapp-loki
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - chatapp-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.17.0
    container_name: chatapp-alloy
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    ports:
      - '127.0.0.1:${ALLOY_PORT:-12345}:12345'
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - chatapp-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: chatapp-grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
      - loki
      - alloy
    networks:
      - chatapp-network
    restart: unless-stopped

volumes:
  user-db-data:
  mongo-data:
  auth-db-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:

networks:
  chatapp-network:
    driver: bridge
