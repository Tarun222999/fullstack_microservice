receivers:
  otlp:
    protocols:
      grpc:
        endpoint: '[::]:4317'
      http:
        endpoint: '[::]:4318'

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:

exporters:
  debug:
    verbosity: basic
  otlp/jaeger:
    endpoint: ${env:JAEGER_OTLP_ENDPOINT}
    tls:
      insecure: true
  prometheus:
    endpoint: '[::]:9464'

extensions:
  health_check:
    endpoint: '[::]:13133'

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
